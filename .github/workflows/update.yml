name: Mise à jour quotidienne des offres

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-listings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Régénérer README.md et listings.json depuis le radar JobShift
        run: python scripts/update_listings.py
      - name: Publier si la liste a changé
        run: |
          if git diff --quiet; then
            echo "Aucun changement."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md listings.json
          git commit -m "Mise à jour des offres ($(date -u +%Y-%m-%d))"
          git push
